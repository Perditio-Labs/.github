name: milestone-tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: milestone-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PyYAML==6.0.2
      - run: node tests/milestone/run.js
      - run: python -B tests/milestone/test_contract.py
