# Fleet CI pass-rate scorecard.
# Runs the stdlib metrics script on GitHub-hosted ubuntu-latest, then
# commits the refreshed metrics/ci-pass-rate.json and CI_PASS_RATE.md back to
# the default branch. ASCII only.
name: ci-pass-rate

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      # Mint a fresh org-installation token from the perditio-ci-automation GitHub App each run:
      # org-wide Actions read (so the scorecard covers all private repos, not just this one) +
      # contents write (to push the refreshed scorecard). Replaces the repo-scoped GITHUB_TOKEN;
      # auto-refreshing, nothing to rotate.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compute scorecard
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          python metrics/ci_pass_rate.py

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "perditio-bot"
          git config user.email "perditio-bot@users.noreply.github.com"
          git add metrics/ci-pass-rate.json CI_PASS_RATE.md
          if git diff --cached --quiet; then
            echo "No scorecard changes to commit."
            exit 0
          fi
          git commit -m "chore(metrics): refresh CI pass-rate scorecard"
          # Publish to a dedicated, unprotected metrics branch (main is protected by the org
          # permanent-branch-protection ruleset, which blocks the automated push). The scorecard
          # files (metrics/ci-pass-rate.json, CI_PASS_RATE.md) live on this branch.
          git push origin "HEAD:refs/heads/ci-metrics" --force
