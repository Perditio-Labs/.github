# stale-branch-sweeper: weekly org-wide branch hygiene, run IN Perditio-Labs/.github
# and reaching OUT to every non-archived Perditio-Labs repo (private and public).
# Port of PTR-Labs/.github stale-branch-sweeper plus the squash-merged path.
#
#   - mints a perditio-ci-automation GitHub App token (org secrets CI_APP_ID +
#     CI_APP_PRIVATE_KEY; the credential ci-pass-rate already uses);
#   - FAILS unless the token sees >= 30 private repos incl. the private sentinel
#     repo(s) named in the secret SWEEPER_SENTINEL_REPOS (never in this public
#     repo; masked in logs) and can
#     read pull requests there (a guard that cannot fire must not report clean);
#     a missing App permission is reported as BLOCKED and nothing is changed;
#   - archive-tags then deletes merged-orphan branches: 0 ahead of dev (or the
#     default branch) or squash-merged (a merged PR's head sha == the branch
#     tip), never permanent (main master staging dev release*), never an
#     open-PR head or base, tip older than 72 h (mode=apply; report changes
#     nothing);
#   - writes a job summary and opens/updates ONE tracking issue in this repo.
#
# PRIVACY: this repo is PUBLIC, so its logs, job summaries and issues are
# public. The script never prints a private repo's name, branches or PRs here
# (counts only). No artifact is uploaded for the same reason.
#
# RUNNER: GitHub-hosted ubuntu-latest, like every other workflow in this repo.
# The Perditio self-hosted runner group does not allow public repositories,
# and self-hosted runners must not serve a public repo; hosted minutes are
# free for public repos. Triggers are schedule + workflow_dispatch only (no
# fork-reachable trigger can see the org secrets). Logic:
# scripts/stale_branch_sweeper.sh. ASCII only.

name: stale-branch-sweeper

on:
  schedule:
    - cron: '0 7 * * 1'   # weekly, Monday 07:00 UTC (mode=apply)
  workflow_dispatch:
    inputs:
      mode:
        description: "report = dry run (nothing changed); apply = archive-tag + delete"
        type: choice
        options: [report, apply]
        default: report
      use-job-token:
        description: "Positive control: run with the repo GITHUB_TOKEN; the run is GREEN only if the capability guard rejects it"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: stale-branch-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Repos never touched (space-separated names).
      SKIP_REPOS: ""
      MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
      OUT_DIR: sweep-out
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard tests (protected branches, squash path, capability guard, privacy)
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_branch_guard.sh
          bash tests/test_hygiene_lib.sh
          bash tests/test_sweeper_offline.sh

      - name: Mint perditio-ci-automation App token (org-wide)
        id: app-token
        if: ${{ !inputs.use-job-token }}
        # SHA-pinned (privileged token minter). v1.12.0.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Sweep
        id: sweep
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          # A secret, not a variable: secrets are masked in this public repo's logs.
          SENTINEL_REPOS: ${{ secrets.SWEEPER_SENTINEL_REPOS }}
          CONTROL: ${{ inputs.use-job-token && 'control' || 'real' }}
        run: |
          set -euo pipefail
          echo "mode=$MODE control=$CONTROL"
          if [ "$CONTROL" = "control" ]; then
            # Positive control: the job token must be REJECTED by the
            # capability guard. This step is green only when it is.
            if MODE=report bash scripts/stale_branch_sweeper.sh 2> "$RUNNER_TEMP/control.err"; then
              cat "$RUNNER_TEMP/control.err" >&2
              echo "CONTROL FAILED: the sweep PASSED with the repo GITHUB_TOKEN; the capability guard cannot fire." >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/control.err" >&2
            if grep -q "cannot reach the org, so this guard cannot fire" "$RUNNER_TEMP/control.err"; then
              echo "CONTROL PASSED: the job token was rejected by the capability guard ($(cat "$OUT_DIR/repos-seen.txt" 2>/dev/null || echo 'count unknown'))."
              exit 0
            fi
            echo "CONTROL FAILED: the sweep failed, but NOT at the capability guard (see stderr above)." >&2
            exit 1
          fi
          bash scripts/stale_branch_sweeper.sh
          if grep -q '^BLOCKED' "$OUT_DIR/capability.txt" 2>/dev/null; then
            echo "::warning::$(cat "$OUT_DIR/capability.txt")"
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Stale branch sweep: NO SUMMARY (the sweep failed before finishing; see the Sweep step log)" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$OUT_DIR/repos-seen.txt" ]; then echo "Repos visible to token: $(cat "$OUT_DIR/repos-seen.txt")" >> "$GITHUB_STEP_SUMMARY"; fi
          fi

      - name: Open or update the tracking issue
        if: always() && !inputs.use-job-token
        shell: bash
        env:
          # Issues live in THIS repo, so the job token (issues: write) is enough.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SWEEP_OUTCOME: ${{ steps.sweep.outcome }}
        run: bash scripts/post_tracking_issue.sh
