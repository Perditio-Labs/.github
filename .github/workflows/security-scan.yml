# Vendored secret-pattern scan. Self-contained (no cross-repo reusable, no token).
# Runs on GitHub-hosted ubuntu-latest. Runs on PRs (pre-merge) and weekly; the push trigger
# was dropped to cut run volume.
# CI/CD scope only (ADR-001 compliant). Reports location only - never secret values.
# Tamper-resistant: on a PR it runs the scanner copy from the repo's DEFAULT branch, not the PR's copy.
name: security-scan

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Secret pattern scan (location only; values never printed)
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Tamper resistance: prefer the scanner from the default (protected) branch so a PR
          # cannot weaken the scanner that judges it. Fall back to the in-tree copy (e.g. the
          # very PR that introduces the scanner).
          SCANNER="$RUNNER_TEMP/secret_scan.py"
          if git show "origin/${DEFAULT_BRANCH}:.github/scripts/secret_scan.py" > "$SCANNER" 2>/dev/null; then
            echo "Using scanner from origin/${DEFAULT_BRANCH}"
          else
            echo "Default-branch scanner not found; using in-tree copy"
            cp .github/scripts/secret_scan.py "$SCANNER"
          fi
          # Use the runner toolchain python (Python on .path); fall back to python3.
          if command -v python >/dev/null 2>&1; then PY=python; else PY=python3; fi
          "$PY" "$SCANNER" "$GITHUB_WORKSPACE"
