# hygiene-tests: offline tests for the org hygiene scripts (scripts/*.sh) on
# every PR that touches them. No secrets, read-only token, GitHub-hosted (this
# repo is public; the Perditio self-hosted runner group excludes public repos
# and must never run fork code). ASCII only.
name: hygiene-tests

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/stale-branch-sweeper.yml'
      - '.github/workflows/rerun-cancelled-once.yml'
      - '.github/workflows/merge-when-green.yml'
      - '.github/workflows/hygiene-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run every tests/test_*.sh
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          for t in tests/test_*.sh; do
            echo "::group::$t"
            bash "$t" || rc=1
            echo "::endgroup::"
          done
          exit $rc
