# pr-milestone: every PR must carry a milestone whose title is a version (semver X.Y.Z,
# optional leading v, optional -pre-release). Kim 2026-11-02: part of GitFlow from the start.
#
# Modes (input `mode`, else org/repo variable PR_MILESTONE_MODE, else `enforce`):
#   enforce - FAIL when the PR has no milestone or the title is not a version.
#   assign  - when the PR has NO milestone, assign the lowest OPEN version milestone (if none is
#             open, create the next patch of the newest version tag, e.g. tag 1.3.18 -> 1.3.19)
#             and pass. A milestone with a NON-version title still fails in both modes.
# Two ways to use it (pick ONE per repo or the check runs twice):
#   1. Org ruleset `workflows` rule pointing at this file (uses the pull_request trigger below).
#   2. A 10-line caller in the repo: see docs/pr-milestone-caller.example.yml.
# Limits: fork and Dependabot PRs get a read-only token, so assign cannot write there (it fails with a clear
# message; attach by hand). Org-ruleset-required workflows ignore the `types` filter (GitHub runs them on
# opened/synchronize/reopened only), so a milestone removed after a green run is not re-checked until the
# next push; the per-repo caller (docs/pr-milestone-caller.example.yml) honours all types.
# Safety: never checks out or runs PR code; only GITHUB_TOKEN (pull-requests + issues write).
# Private callers use org runners; public events default to GitHub-hosted. ASCII only.
name: pr-milestone
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, milestoned, demilestoned]
  workflow_call:
    inputs:
      mode:
        type: string
        default: ''
        description: 'enforce | assign (empty = variable PR_MILESTONE_MODE, else enforce)'
      target_version:
        type: string
        default: ''
        description: 'Deliberate version target; validates existing milestones and selects assignment'
      runs_on:
        type: string
        default: ''
        description: 'JSON runs-on override; empty = org default'
permissions:
  contents: read
  pull-requests: write
  issues: write
concurrency:
  group: pr-milestone-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-milestone:
    name: pr-milestone
    runs-on: ${{ fromJSON(inputs.runs_on || (github.event.repository.private == false && (vars.PERDITIO_PUBLIC_CI_RUNS_ON || '["ubuntu-latest"]')) || '["self-hosted","Linux","X64","perditio"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        env:
          TARGET_VERSION: ${{ inputs.target_version || vars.PR_MILESTONE_TARGET_VERSION }}
          MODE: ${{ inputs.mode || vars.PR_MILESTONE_MODE || 'enforce' }}
        with:
          script: |
            const mode = String(process.env.MODE || 'enforce').trim().toLowerCase();
            if (mode !== 'enforce' && mode !== 'assign') { core.setFailed(`pr-milestone: unknown mode "${mode}" (enforce|assign)`); return; }
            const SEMVER = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
            const parse = (t) => { const m = SEMVER.exec(String(t || '').trim()); return m ? { maj: BigInt(m[1]), min: BigInt(m[2]), pat: BigInt(m[3]), pre: m[4] || null } : null; };
            const cmpId = (a, b) => { const an = /^\d+$/.test(a), bn = /^\d+$/.test(b); if (an && bn) { const x = BigInt(a), y = BigInt(b); return x < y ? -1 : x > y ? 1 : 0; } if (an) return -1; if (bn) return 1; return a < b ? -1 : a > b ? 1 : 0; };
            const cmp = (a, b) => {
              for (const k of ['maj', 'min', 'pat']) if (a[k] !== b[k]) return a[k] < b[k] ? -1 : 1;
              if (a.pre === b.pre) return 0; if (!a.pre) return 1; if (!b.pre) return -1;
              const x = a.pre.split('.'), y = b.pre.split('.');
              for (let i = 0; i < Math.max(x.length, y.length); i++) { if (x[i] === undefined) return -1; if (y[i] === undefined) return 1; const c = cmpId(x[i], y[i]); if (c) return c; }
              return 0;
            };
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request && context.payload.pull_request.number;
            if (!number) { core.setFailed('pr-milestone: no pull_request in the event payload'); return; }
            // Re-fetch: milestoned/demilestoned payloads can be stale.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const target = String(process.env.TARGET_VERSION || '').trim();
            if (target && !parse(target)) { core.setFailed('pr-milestone: target_version must be a valid version'); return; }
            const ms = pr.milestone;
            if (ms && target && (!parse(ms.title) || cmp(parse(ms.title), parse(target)) !== 0)) { core.setFailed(`PR #${number}: milestone does not match target version ${target}`); return; }
            if (ms) {
              if (parse(ms.title)) { core.notice(`PR #${number}: milestone "${ms.title}" is a version. OK.`); return; }
              core.setFailed(`PR #${number}: milestone "${ms.title}" is not a version. Rename it or pick a version milestone (X.Y.Z, optional leading v, optional -pre-release).`);
              return;
            }
            if (mode === 'enforce') {
              core.setFailed(`PR #${number} has no milestone. Attach the version milestone it ships in (e.g. 1.3.19): gh pr edit ${number} --milestone <version>. Create it first if absent: gh api repos/${owner}/${repo}/milestones -f title=<version>`);
              return;
            }
            // mode === assign
            const open = (await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'open', per_page: 100 }))
              .map((m) => ({ m, v: parse(m.title) })).filter((x) => x.v).sort((a, b) => cmp(a.v, b.v));
            let chosen = target ? open.find(x => cmp(x.v, parse(target)) === 0)?.m : (open.length ? open[0].m : null);
            if (!chosen) {
              const tags = (await github.paginate(github.rest.repos.listTags, { owner, repo, per_page: 100 }, (r, done) => r.data))
                .map((t) => ({ t, v: parse(t.name) })).filter((x) => x.v).sort((a, b) => cmp(b.v, a.v));
              let next = target || '0.0.1';
              if (!target && tags.length) { const v = tags[0].v; next = v.pre ? `${v.maj}.${v.min}.${v.pat}` : `${v.maj}.${v.min}.${v.pat + 1n}`; }
              try {
                chosen = (await github.rest.issues.createMilestone({ owner, repo, title: next })).data;
              } catch (e) {
                if (e.status === 403) { core.setFailed(`PR #${number}: token cannot create milestone "${next}" (403). Fork/Dependabot PRs get a read-only token; attach a milestone by hand.`); return; }
                if (e.status !== 422) throw e;
                const all = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all', per_page: 100 });
                chosen = all.find((m) => m.title === next);
                if (!chosen) throw e;
                if (chosen.state === 'closed') chosen = (await github.rest.issues.updateMilestone({ owner, repo, milestone_number: chosen.number, state: 'open' })).data;
              }
            }
            try {
              await github.rest.issues.update({ owner, repo, issue_number: number, milestone: chosen.number });
            } catch (e) {
              core.setFailed(`PR #${number}: could not assign milestone "${chosen.title}" (${e.status}: ${e.message}). Fork PRs and read-only tokens cannot be auto-assigned; attach it by hand.`);
              return;
            }
            core.notice(`PR #${number}: no milestone, assigned "${chosen.title}" (mode=assign).`);
            await core.summary.addRaw(`pr-milestone (assign): PR #${number} -> milestone ${chosen.title}`).write();
