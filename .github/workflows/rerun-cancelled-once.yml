# rerun-cancelled-once: every 30 minutes, re-run ONCE the workflow runs on
# open-PR heads across every non-archived Perditio-Labs repo that were
# cancelled in the last 24 h (newest run of that workflow for that sha,
# run_attempt 1, so never twice). Cap 20 re-runs per tick.
#
#   - perditio-ci-automation App token (CI_APP_ID / CI_APP_PRIVATE_KEY):
#     actions write (re-run) + pull requests read (open-PR heads);
#   - capability guard: >= 30 private repos incl. the private sentinel repo(s)
#     named in the secret SWEEPER_SENTINEL_REPOS (never in this public repo), both
#     permissions probed; a reach failure fails the job; a missing App
#     permission is BLOCKED: nothing re-run, a warning on scheduled ticks (no
#     failure mail every 30 min), a failure on a dispatched apply;
#   - schedule = apply; dispatch defaults to report (dry run).
#
# PRIVACY: this repo is PUBLIC (logs and job summaries are public). The
# script never prints a private repo's name, PRs or run ids (counts only).
# RUNNER: GitHub-hosted ubuntu-latest, like every workflow in this repo (the
# Perditio self-hosted runner group excludes public repos). Logic:
# scripts/rerun_cancelled_once.sh. ASCII only.

name: rerun-cancelled-once

on:
  schedule:
    - cron: '17,47 * * * *'   # every 30 min, off the hour
  workflow_dispatch:
    inputs:
      mode:
        description: "report = dry run (nothing re-run); apply = re-run"
        type: choice
        options: [report, apply]
        default: report

permissions:
  contents: read

concurrency:
  group: rerun-cancelled-once
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODE: ${{ github.event_name == 'schedule' && 'apply' || inputs.mode }}
      STRICT: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      OUT_DIR: rerun-out
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard tests
        shell: bash
        run: |
          set -euo pipefail
          bash tests/test_hygiene_lib.sh
          bash tests/test_rerun_cancelled.sh

      - name: Mint perditio-ci-automation App token (org-wide)
        id: app-token
        # SHA-pinned (privileged token minter). v1.12.0.
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Re-run cancelled runs once
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # A secret, not a variable: secrets are masked in this public repo's logs.
          SENTINEL_REPOS: ${{ secrets.SWEEPER_SENTINEL_REPOS }}
        run: |
          set -euo pipefail
          echo "mode=$MODE strict=$STRICT"
          bash scripts/rerun_cancelled_once.sh
          if grep -q '^BLOCKED' "$OUT_DIR/capability.txt" 2>/dev/null; then
            echo "::warning::$(cat "$OUT_DIR/capability.txt")"
          fi

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$OUT_DIR/summary.md" ]; then
            cat "$OUT_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Re-run cancelled once: NO SUMMARY (see the step log)" >> "$GITHUB_STEP_SUMMARY"
          fi
